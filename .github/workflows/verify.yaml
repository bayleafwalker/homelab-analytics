name: Verify

on:
  pull_request:

jobs:
  # TS-6: committed auditctl shards are authoritative evidence until the S4
  # evidence-home import and must not be rewritten. Fetches the checker from
  # agentops (public), pinned to a specific commit.
  append-only-shards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout agentops at a pinned commit
        uses: actions/checkout@v4
        with:
          repository: bayleafwalker/agentops
          ref: 775e9c0fc35aa4d6d29f3a087a8b913acc09ffac
          path: agentops-contracts

      - name: check
        run: |
          python3 agentops-contracts/scripts/check_append_only_shards.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  verify-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: azure/setup-helm@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          cd apps/web/frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run blocking verification
        run: make verify-fast

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ github.sha }}
          path: apps/web/frontend/test-results
          if-no-files-found: ignore

      - name: Build contract artifact bundle for pull requests
        run: make contract-release-artifacts CONTRACT_BASE_REF=origin/${{ github.base_ref }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: contract-artifacts-${{ github.sha }}
          path: dist/contracts

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: make docker-build

      - name: Run Compose startup smoke
        run: make compose-smoke

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Advisory dependency audit
        run: make audit-deps
