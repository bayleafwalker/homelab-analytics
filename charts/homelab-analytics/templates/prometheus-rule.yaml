{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "homelab-analytics.fullname" . }}
  labels:
    {{- include "homelab-analytics.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "homelab-analytics.fullname" . }}.runtime
      rules:
        {{- if .Values.api.enabled }}
        - alert: HomelabAnalyticsApiUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="{{ .Release.Namespace }}",deployment="{{ include "homelab-analytics.fullname" . }}-api"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: API deployment has unavailable replicas.
            description: The API deployment is not meeting its desired ready replica count.
        {{- end }}
        {{- if .Values.web.enabled }}
        - alert: HomelabAnalyticsWebUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="{{ .Release.Namespace }}",deployment="{{ include "homelab-analytics.fullname" . }}-web"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Web deployment has unavailable replicas.
            description: The web deployment is not meeting its desired ready replica count.
        {{- end }}
        - alert: HomelabAnalyticsStaleDispatches
          expr: worker_stale_dispatches > 0
          for: {{ .Values.monitoring.prometheusRule.dispatchStaleFor }}
          labels:
            severity: critical
          annotations:
            summary: Stale schedule dispatches detected.
            description: One or more schedule dispatches are still marked running with expired claims.
        - alert: HomelabAnalyticsWorkerHeartbeatStale
          expr: worker_oldest_heartbeat_age_seconds > {{ .Values.monitoring.prometheusRule.heartbeatAgeThresholdSeconds }}
          for: {{ .Values.monitoring.prometheusRule.heartbeatAgeFor }}
          labels:
            severity: warning
          annotations:
            summary: Worker heartbeat age is above the configured threshold.
            description: No worker heartbeat has been refreshed within the expected interval.
        - alert: HomelabAnalyticsDispatchFailureRateHigh
          expr: worker_failed_dispatch_ratio > {{ .Values.monitoring.prometheusRule.dispatchFailureRatioThreshold }}
          for: {{ .Values.monitoring.prometheusRule.dispatchFailureRatioFor }}
          labels:
            severity: warning
          annotations:
            summary: Schedule dispatch failure ratio is elevated.
            description: Failed schedule dispatches exceed the configured terminal-dispatch ratio threshold.
        - alert: HomelabAnalyticsAuthFailuresHigh
          expr: increase(auth_failures_total[5m]) >= {{ .Values.monitoring.prometheusRule.authFailuresThreshold }}
          for: {{ .Values.monitoring.prometheusRule.authFailuresFor }}
          labels:
            severity: warning
          annotations:
            summary: Authentication failures are elevated.
            description: Login or auth failures have crossed the configured threshold in the recent window.
        - alert: HomelabAnalyticsServiceTokensExpiring
          expr: auth_service_tokens_expiring_7d >= {{ .Values.monitoring.prometheusRule.serviceTokensExpiringThreshold }}
          for: {{ .Values.monitoring.prometheusRule.serviceTokensExpiringFor }}
          labels:
            severity: warning
          annotations:
            summary: Service tokens are expiring soon.
            description: One or more active service tokens will expire within seven days.
    {{- with .Values.monitoring.prometheusRule.slo }}
    {{- if .enabled }}
    # SLOs from docs/runbooks/slo.md. Recording rules first, then alerts.
    - name: {{ include "homelab-analytics.fullname" $ }}.slo
      rules:
        - record: homelab_analytics:http_requests:rate5m
          expr: sum(rate(homelab_analytics_http_requests_total{route!~"/metrics|/health|/ready"}[5m]))
        {{- range $window := list "5m" "30m" "1h" "6h" }}
        - record: homelab_analytics:http_errors:ratio_rate{{ $window }}
          expr: |-
            sum(rate(homelab_analytics_http_requests_total{route!~"/metrics|/health|/ready",status=~"5.."}[{{ $window }}]))
            /
            clamp_min(sum(rate(homelab_analytics_http_requests_total{route!~"/metrics|/health|/ready"}[{{ $window }}])), 1e-9)
        {{- end }}
        - record: homelab_analytics:http_slow:ratio_rate1h
          expr: |-
            1 - (
              sum(rate(homelab_analytics_http_request_duration_seconds_bucket{route!~"/metrics|/health|/ready",le="{{ .latencyThresholdSeconds }}"}[1h]))
              /
              clamp_min(sum(rate(homelab_analytics_http_request_duration_seconds_count{route!~"/metrics|/health|/ready"}[1h])), 1e-9)
            )
        - record: homelab_analytics:publication_refresh_errors:ratio_rate6h
          expr: |-
            sum(increase(homelab_analytics_publication_refresh_duration_seconds_count{outcome="error"}[6h]))
            /
            clamp_min(sum(increase(homelab_analytics_publication_refresh_duration_seconds_count[6h])), 1e-9)
        - record: homelab_analytics:backup_age_seconds
          expr: time() - max(homelab_analytics_backup_last_success_timestamp_seconds > 0)
        - record: homelab_analytics:backup_ship_age_seconds
          expr: time() - max(homelab_analytics_backup_ship_last_success_timestamp_seconds > 0)
        # Ingestion success: landed / (landed + failed). Rejected runs are data
        # problems and received runs are in flight; neither counts.
        - record: homelab_analytics:ingestion_runs_attempted:increase1d
          expr: sum(max by (status) (increase(homelab_analytics_ingestion_runs_recorded_total{status=~"landed|failed"}[1d])))
        - record: homelab_analytics:ingestion_failures:ratio_increase1d
          expr: |-
            sum(max by (status) (increase(homelab_analytics_ingestion_runs_recorded_total{status="failed"}[1d])))
            /
            clamp_min(sum(max by (status) (increase(homelab_analytics_ingestion_runs_recorded_total{status=~"landed|failed"}[1d]))), 1e-9)
        - record: homelab_analytics:ha_bridge_connected:ratio_avg6h
          expr: max(avg_over_time(homelab_analytics_ha_bridge_connected[6h]))
        - alert: HomelabAnalyticsApiErrorBudgetFastBurn
          # 14.4x burn of a {{ .apiAvailabilityTarget }} target exhausts a 30-day budget in ~2 days.
          expr: |-
            homelab_analytics:http_errors:ratio_rate5m > (14.4 * (1 - {{ .apiAvailabilityTarget }}))
            and homelab_analytics:http_errors:ratio_rate1h > (14.4 * (1 - {{ .apiAvailabilityTarget }}))
            and homelab_analytics:http_requests:rate5m > {{ .minRequestRate }}
          for: 2m
          labels:
            severity: critical
            slo: api-availability
          annotations:
            summary: API is burning its availability error budget fast.
            description: More than 14.4x the allowed 5xx ratio over both 5m and 1h windows.
        - alert: HomelabAnalyticsApiErrorBudgetSlowBurn
          expr: |-
            homelab_analytics:http_errors:ratio_rate30m > (6 * (1 - {{ .apiAvailabilityTarget }}))
            and homelab_analytics:http_errors:ratio_rate6h > (6 * (1 - {{ .apiAvailabilityTarget }}))
            and homelab_analytics:http_requests:rate5m > {{ .minRequestRate }}
          for: 15m
          labels:
            severity: warning
            slo: api-availability
          annotations:
            summary: API is burning its availability error budget.
            description: More than 6x the allowed 5xx ratio over both 30m and 6h windows.
        - alert: HomelabAnalyticsApiLatencySloAtRisk
          expr: |-
            homelab_analytics:http_slow:ratio_rate1h > (1 - {{ .apiLatencyTarget }}) * 2
            and homelab_analytics:http_requests:rate5m > {{ .minRequestRate }}
          for: 30m
          labels:
            severity: warning
            slo: api-latency
          annotations:
            summary: API requests slower than {{ .latencyThresholdSeconds }}s exceed twice the latency budget.
            description: Check slow routes on the Homelab Analytics dashboard (p95 by route).
        - alert: HomelabAnalyticsSourceOverdue
          expr: max by (source_asset_id, dataset) (homelab_analytics_source_overdue_seconds) > {{ .freshnessOverdueSeconds }}
          for: 1h
          labels:
            severity: warning
            slo: source-freshness
          annotations:
            summary: Source {{ "{{ $labels.source_asset_id }}" }} is overdue.
            description: The source is more than {{ .freshnessOverdueSeconds }}s past its next expected ingest. Upload the missing period or fix the ingestion definition.
        - alert: HomelabAnalyticsPublicationRefreshFailing
          expr: homelab_analytics:publication_refresh_errors:ratio_rate6h > (1 - {{ .refreshSuccessTarget }})
          for: 30m
          labels:
            severity: warning
            slo: refresh-success
          annotations:
            summary: Publication refreshes are failing above budget.
            description: More than {{ printf "%.1f" (mulf (subf 1.0 .refreshSuccessTarget) 100.0) }}% of publication refreshes failed over 6h.
        - alert: HomelabAnalyticsPublicationsUnreliable
          expr: sum(homelab_analytics_publication_confidence_verdicts{verdict=~"unreliable|unavailable"}) > 0
          for: 6h
          labels:
            severity: info
            slo: refresh-success
          annotations:
            summary: Some publications have unreliable or unavailable confidence verdicts.
            description: See /control/source-freshness and publication confidence in the web control plane.
        - alert: HomelabAnalyticsWorkerLoopStalled
          expr: time() - max(homelab_analytics_worker_last_heartbeat_timestamp_seconds) > {{ .workerHeartbeatMaxAgeSeconds }}
          for: 5m
          labels:
            severity: critical
            slo: worker-liveness
          annotations:
            summary: No worker heartbeat for more than {{ .workerHeartbeatMaxAgeSeconds }}s.
            description: The dispatch loop is not iterating; schedules, ingestion and scheduled backups are stopped.
        - alert: HomelabAnalyticsBackupStale
          expr: homelab_analytics:backup_age_seconds > {{ .backupMaxAgeSeconds }}
          for: 30m
          labels:
            severity: warning
            slo: backup-recency
          annotations:
            summary: No verified warehouse/landing backup in more than {{ .backupMaxAgeSeconds }}s.
            description: Check backup-status.json last_error; the worker logs "scheduled backup failed" with the reason.
        - alert: HomelabAnalyticsBackupNeverSucceeded
          expr: max(homelab_analytics_backup_status_present) == 1 unless max(homelab_analytics_backup_last_success_timestamp_seconds) > 0
          for: 6h
          labels:
            severity: warning
            slo: backup-recency
          annotations:
            summary: Scheduled backups are enabled but none has succeeded yet.
            description: Check backup-status.json last_error in the backup directory.
        - alert: HomelabAnalyticsBackupFailing
          expr: max(homelab_analytics_backup_consecutive_failures) >= 3
          for: 5m
          labels:
            severity: warning
            slo: backup-recency
          annotations:
            summary: Three or more consecutive scheduled backups failed.
            description: A writer held the DuckDB warehouse lock through every retry window (a long worker promotion or a stuck process), or the backup volume is full.
        - alert: HomelabAnalyticsRestoreDrillStale
          expr: time() - max(homelab_analytics_backup_restore_drill_last_success_timestamp_seconds) > {{ .restoreDrillMaxAgeSeconds }}
          for: 1h
          labels:
            severity: info
            slo: backup-recency
          annotations:
            summary: No passing restore drill recently.
            description: Run "homelab-analytics-worker restore-drill" (docs/runbooks/backup-and-restore.md).
        - alert: HomelabAnalyticsBackupShipStale
          expr: homelab_analytics:backup_ship_age_seconds > {{ .backupShipMaxAgeSeconds }}
          for: 30m
          labels:
            severity: warning
            slo: backup-offsite
          annotations:
            summary: No backup bundle shipped off-site in more than {{ .backupShipMaxAgeSeconds }}s.
            description: Check ship-status.json last_error and the backup-ship container log; a stale local backup (BackupStale) also stops shipments.
        - alert: HomelabAnalyticsBackupShipPending
          expr: max(homelab_analytics_backup_ship_pending_bundles) > 0
          for: {{ .backupShipPendingFor }}
          labels:
            severity: warning
            slo: backup-offsite
          annotations:
            summary: A verified backup bundle has not been shipped off-site for {{ .backupShipPendingFor }}.
            description: The backup-ship sidecar retries every pass; check its log ("shipping ... failed", "age not available") and ship-status.json last_error.
        - alert: HomelabAnalyticsBackupShipStalled
          expr: time() - max(homelab_analytics_backup_ship_last_pass_timestamp_seconds) > {{ .backupShipPassMaxAgeSeconds }}
          for: 15m
          labels:
            severity: warning
            slo: backup-offsite
          annotations:
            summary: The backup-ship sidecar has not finished a pass in more than {{ .backupShipPassMaxAgeSeconds }}s.
            description: The sidecar is stuck (a hung upload) or not running; check the backup-ship container status and log.
        - alert: HomelabAnalyticsIngestionFailing
          # {{ .ingestionFailureBurnFactor }}x the {{ .ingestionSuccessTarget }} target's failure share over a day, with enough runs to mean something.
          expr: |-
            homelab_analytics:ingestion_failures:ratio_increase1d > ({{ .ingestionFailureBurnFactor }} * (1 - {{ .ingestionSuccessTarget }}))
            and homelab_analytics:ingestion_runs_attempted:increase1d >= {{ .ingestionMinRunsPerDay }}
          for: 1h
          labels:
            severity: warning
            slo: ingestion-success
          annotations:
            summary: Ingestion runs are failing above budget.
            description: More than {{ printf "%.0f" (mulf .ingestionFailureBurnFactor (subf 1.0 .ingestionSuccessTarget) 100.0) }}% of landed-or-failed ingestion runs failed over 1d. list-runs shows the failed runs and their errors.
        - alert: HomelabAnalyticsHaBridgeDisconnected
          expr: max(homelab_analytics_ha_bridge_connected) == 0
          for: 15m
          labels:
            severity: warning
            slo: ha-bridge-availability
          annotations:
            summary: The Home Assistant bridge has been disconnected for 15m.
            description: GET /api/ha/bridge/status shows reconnect_count; check Home Assistant reachability and the HA token.
        - alert: HomelabAnalyticsHaBridgeAvailabilityBurn
          expr: homelab_analytics:ha_bridge_connected:ratio_avg6h < (1 - 6 * (1 - {{ .haBridgeAvailabilityTarget }}))
          for: 30m
          labels:
            severity: warning
            slo: ha-bridge-availability
          annotations:
            summary: The Home Assistant bridge is burning its availability budget (flapping).
            description: Connected less than {{ printf "%.0f" (mulf (subf 1.0 (mulf 6.0 (subf 1.0 .haBridgeAvailabilityTarget))) 100.0) }}% of the last 6h.
        - alert: HomelabAnalyticsHaBridgeSilent
          expr: |-
            max(homelab_analytics_ha_bridge_connected) == 1
            and min(homelab_analytics_ha_bridge_last_message_age_seconds) > {{ .haBridgeMaxMessageAgeSeconds }}
          for: 15m
          labels:
            severity: warning
            slo: ha-bridge-availability
          annotations:
            summary: The Home Assistant bridge is connected but has ingested nothing for more than {{ .haBridgeMaxMessageAgeSeconds }}s.
            description: The state_changed subscription is broken or Home Assistant is idle; restart the api container if Home Assistant is producing events.
        - alert: HomelabAnalyticsMetricsCollectorDown
          expr: min by (collector) (homelab_analytics_metrics_collector_up) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Scrape-time collector {{ "{{ $labels.collector }}" }} is failing.
            description: SLO metrics from this collector are stale; check API logs for "metrics collector failed".
    {{- end }}
    {{- end }}
{{- end }}
