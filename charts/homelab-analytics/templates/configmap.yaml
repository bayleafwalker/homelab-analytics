apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homelab-analytics.fullname" . }}-config
  labels:
    {{- include "homelab-analytics.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.commonEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if not (hasKey .Values.commonEnv "HOMELAB_ANALYTICS_HOUSEHOLD_TIMEZONE") }}
  {{- $tz := toString ((.Values.household | default dict).timezone | default "UTC") }}
  {{- if not (regexMatch "^[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z0-9_+-]+)*$" $tz) }}
  {{- fail (printf "household.timezone must be an IANA timezone name such as Europe/Helsinki, got %q" $tz) }}
  {{- end }}
  HOMELAB_ANALYTICS_HOUSEHOLD_TIMEZONE: {{ $tz | quote }}
  {{- end }}
  {{- if gt (int .Values.backup.intervalSeconds) 0 }}
  HOMELAB_ANALYTICS_BACKUP_INTERVAL_SECONDS: {{ .Values.backup.intervalSeconds | quote }}
  HOMELAB_ANALYTICS_BACKUP_RETENTION_COUNT: {{ .Values.backup.retentionCount | quote }}
  {{- with .Values.backup.dir }}
  HOMELAB_ANALYTICS_BACKUP_DIR: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- $snapshotRetention := (.Values.reporting | default dict).snapshotRetentionMonths }}
  {{- if and (not (kindIs "invalid" $snapshotRetention)) (not (hasKey .Values.commonEnv "HOMELAB_ANALYTICS_REPORTING_SNAPSHOT_RETENTION_MONTHS")) }}
  {{- if lt (int $snapshotRetention) 1 }}
  {{- fail "reporting.snapshotRetentionMonths must be at least 1" }}
  {{- end }}
  HOMELAB_ANALYTICS_REPORTING_SNAPSHOT_RETENTION_MONTHS: {{ int $snapshotRetention | toString | quote }}
  {{- end }}
  {{- /* Non-secret OIDC settings (values.oidc), only in oidc identity mode.
         Empty values are skipped; a key already in commonEnv wins. */}}
  {{- if eq (toString (index .Values.commonEnv "HOMELAB_ANALYTICS_IDENTITY_MODE")) "oidc" }}
  {{- $oidc := .Values.oidc | default dict }}
  {{- $common := .Values.commonEnv }}
  {{- $entries := list
      (list "HOMELAB_ANALYTICS_OIDC_ISSUER_URL" $oidc.issuerUrl)
      (list "HOMELAB_ANALYTICS_OIDC_DISCOVERY_URL" $oidc.discoveryUrl)
      (list "HOMELAB_ANALYTICS_OIDC_REDIRECT_URI" $oidc.redirectUri)
      (list "HOMELAB_ANALYTICS_OIDC_POST_LOGOUT_REDIRECT_URI" $oidc.postLogoutRedirectUri)
      (list "HOMELAB_ANALYTICS_OIDC_API_AUDIENCE" $oidc.apiAudience)
      (list "HOMELAB_ANALYTICS_OIDC_SCOPES" (join "," ($oidc.scopes | default list)))
      (list "HOMELAB_ANALYTICS_OIDC_USERNAME_CLAIM" $oidc.usernameClaim)
      (list "HOMELAB_ANALYTICS_OIDC_GROUPS_CLAIM" $oidc.groupsClaim)
      (list "HOMELAB_ANALYTICS_OIDC_PERMISSIONS_CLAIM" $oidc.permissionsClaim)
      (list "HOMELAB_ANALYTICS_OIDC_PERMISSION_GROUP_MAPPINGS" (join ";" ($oidc.permissionGroupMappings | default list)))
      (list "HOMELAB_ANALYTICS_OIDC_READER_GROUPS" (join "," ($oidc.readerGroups | default list)))
      (list "HOMELAB_ANALYTICS_OIDC_OPERATOR_GROUPS" (join "," ($oidc.operatorGroups | default list)))
      (list "HOMELAB_ANALYTICS_OIDC_ADMIN_GROUPS" (join "," ($oidc.adminGroups | default list)))
      (list "HOMELAB_ANALYTICS_OIDC_CLIENT_SECRET_REF" $oidc.clientSecretRef)
      (list "HOMELAB_ANALYTICS_OIDC_JWKS_CACHE_SECONDS" $oidc.jwksCacheSeconds)
      (list "HOMELAB_ANALYTICS_OIDC_CLOCK_SKEW_SECONDS" $oidc.clockSkewSeconds) }}
  {{- range $entry := $entries }}
  {{- $key := index $entry 0 }}
  {{- $value := index $entry 1 }}
  {{- if and (not (kindIs "invalid" $value)) (ne (toString $value) "") (not (hasKey $common $key)) }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
