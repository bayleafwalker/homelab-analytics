nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/bayleafwalker/homelab-analytics
  tag: "v0.1.9"
  # Immutable digest (sha256:...). When set it wins over `tag`.
  digest: ""
  pullPolicy: IfNotPresent

webImage:
  repository: ghcr.io/bayleafwalker/homelab-analytics-web
  tag: "v0.1.9"
  # Immutable digest (sha256:...). When set it wins over `tag`.
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

commonEnv:
  HOMELAB_ANALYTICS_DATA_DIR: /data
  HOMELAB_ANALYTICS_API_HOST: 0.0.0.0
  HOMELAB_ANALYTICS_API_PORT: "8080"
  HOMELAB_ANALYTICS_WEB_HOST: 0.0.0.0
  HOMELAB_ANALYTICS_WEB_PORT: "8081"
  HOMELAB_ANALYTICS_WORKER_POLL_INTERVAL: "30"
  HOMELAB_ANALYTICS_CONTROL_PLANE_BACKEND: postgres
  HOMELAB_ANALYTICS_IDENTITY_MODE: oidc
  HOMELAB_ANALYTICS_REPORTING_BACKEND: postgres

extraEnv: []

# Non-secret OIDC settings, rendered into the shared ConfigMap only while
# commonEnv.HOMELAB_ANALYTICS_IDENTITY_MODE is "oidc" (runbook:
# docs/runbooks/oidc-authentik-enablement.md). Empty values are left out so
# the application defaults apply. Credentials stay in the Secret(s) listed
# under api/web.secretEnvFrom (client id, client secret, session secret);
# envFrom lists the Secret after the ConfigMap, so a key set in both takes
# the Secret's value.
oidc:
  # e.g. https://<authentik-host>/application/o/homelab-analytics/ (keep the
  # trailing slash Authentik advertises).
  issuerUrl: ""
  # Overrides <issuer>/.well-known/openid-configuration.
  discoveryUrl: ""
  # e.g. https://analytics.<your-domain>/auth/callback
  redirectUri: ""
  # Optional RP-initiated logout target; must be registered with the IdP.
  postLogoutRedirectUri: ""
  apiAudience: ""
  # Default: openid, profile, email.
  scopes: []
  usernameClaim: ""
  groupsClaim: ""
  permissionsClaim: ""
  # "<group>=<permission>[,<permission>]" entries.
  permissionGroupMappings: []
  readerGroups: []
  operatorGroups: []
  adminGroups: []
  # "<secret_name>/<secret_key>" resolved from HOMELAB_ANALYTICS_SECRET__*;
  # set this or a literal HOMELAB_ANALYTICS_OIDC_CLIENT_SECRET, not both.
  clientSecretRef: ""
  # Discovery/JWKS cache TTL and token clock-skew leeway, in seconds.
  jwksCacheSeconds: ""
  clockSkewSeconds: ""

service:
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: analytics.example.internal
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

monitoring:
  prometheusRule:
    enabled: false
    labels: {}
    dispatchStaleFor: 10m
    heartbeatAgeThresholdSeconds: 300
    heartbeatAgeFor: 10m
    dispatchFailureRatioThreshold: 0.25
    dispatchFailureRatioFor: 15m
    authFailuresThreshold: 5
    authFailuresFor: 15m
    serviceTokensExpiringThreshold: 1
    serviceTokensExpiringFor: 30m
    # SLO recording rules and burn-rate alerts (docs/runbooks/slo.md).
    slo:
      enabled: true
      apiAvailabilityTarget: 0.995
      apiLatencyTarget: 0.95
      # Must match a histogram bucket bound exactly (rendered like "1.0").
      latencyThresholdSeconds: "1.0"
      # Below this request rate (req/s) burn-rate alerts stay quiet.
      minRequestRate: 0.01
      refreshSuccessTarget: 0.99
      freshnessOverdueSeconds: 86400
      workerHeartbeatMaxAgeSeconds: 600
      backupMaxAgeSeconds: 93600
      restoreDrillMaxAgeSeconds: 691200
      # Off-site shipment (backup-ship sidecar's ship-status.json). Silent where
      # no sidecar writes the file.
      backupShipMaxAgeSeconds: 93600
      backupShipPendingFor: 2h
      backupShipPassMaxAgeSeconds: 3600
      # Ingestion success: landed / (landed + failed) runs.
      ingestionSuccessTarget: 0.98
      ingestionFailureBurnFactor: 5.0
      ingestionMinRunsPerDay: 3
      # Home Assistant bridge (API process). Silent where no bridge runs.
      haBridgeAvailabilityTarget: 0.99
      haBridgeMaxMessageAgeSeconds: 3600
  # PodMonitor scraping the api /metrics and the worker metrics port.
  podMonitor:
    enabled: false
    labels: {}
    interval: 60s
    # Optional Secret holding HOMELAB_ANALYTICS_METRICS_TOKEN for scrapes
    # ("Authorization: Metrics <token>"). Leave name empty for network-internal
    # scrapes without a token.
    scrapeTokenSecret:
      name: ""
      key: token
  # Grafana dashboard ConfigMap for the kube-prometheus-stack sidecar.
  grafanaDashboard:
    enabled: false
    namespace: ""
    labels:
      grafana_dashboard: "1"

household:
  # IANA timezone (e.g. Europe/Helsinki) for hour-of-day and calendar-date
  # reporting: spend heatmap hours, wallboard power buckets, morning brief
  # dates. Rendered as HOMELAB_ANALYTICS_HOUSEHOLD_TIMEZONE; the API, web and
  # worker refuse to start on a name the image's zone database cannot load.
  timezone: UTC

backup:
  # Worker-loop scheduled backups of the DuckDB warehouse + filesystem landing.
  # 0 disables; 86400 = daily. Bundles land in dir (default <data>/backups).
  intervalSeconds: 0
  retentionCount: 7
  dir: ""

reporting:
  # Dated as-of snapshots of the current-only reporting publications (household
  # overview, attention items, ...). Keeps the newest N reference months per
  # publication; must be at least 1. Rendered as
  # HOMELAB_ANALYTICS_REPORTING_SNAPSHOT_RETENTION_MONTHS unless commonEnv
  # already sets that key.
  snapshotRetentionMonths: 24

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  storageClass: ""

api:
  enabled: true
  replicas: 1
  port: 8080
  secretEnvFrom:
    - homelab-analytics-auth-oidc
  resources: {}

web:
  enabled: true
  replicas: 1
  port: 8081
  # The web workload is a standalone Next.js server and does not read the
  # shared data directory. Leaving this false keeps the web pod off the data
  # PVC so a ReadWriteOnce claim does not constrain web scheduling.
  mountData: false
  secretEnvFrom:
    - homelab-analytics-auth-oidc
  resources: {}

worker:
  enabled: true
  replicas: 1
  secretEnvFrom: []
  command:
    - homelab-analytics-worker
    - watch-schedule-dispatches
  # Worker /metrics port (HOMELAB_ANALYTICS_WORKER_METRICS_PORT); 0 disables.
  metricsPort: 9464
  resources: {}
