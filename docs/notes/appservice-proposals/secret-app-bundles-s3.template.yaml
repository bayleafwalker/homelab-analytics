# PROPOSED TEMPLATE, placeholders only. Never commit real values here.
#
# A dedicated Hetzner S3 credential for the backup-ship sidecar, confined by
# bucket-policy-app-bundles.template.json to
#   appservice-pgdump-locked/backups/app-bundles/analytics/homelab-analytics/
# so a leaked app-pod credential cannot read the pgdump-age series or other
# app prefixes. Today the sidecar reuses analytics-cnpg-backup-s3 (the shared
# cluster key, like cnpg-pgdump-age).
#
# In appservice: copy to
#   clusters/main/kubernetes/apps/homelab-analytics/app/homelab-analytics-bundles-s3.secret.yaml
# replace both REPLACE_WITH_* values with the new key, then encrypt in place
# before staging it (the *.secret.yaml rule in .sops.yaml covers the path):
#   sops --encrypt --in-place clusters/main/kubernetes/apps/homelab-analytics/app/homelab-analytics-bundles-s3.secret.yaml
# Steps and verification: README.md "Dedicated app-bundles S3 key".
apiVersion: v1
kind: Secret
metadata:
  name: homelab-analytics-bundles-s3
  namespace: analytics
  labels:
    app.kubernetes.io/name: homelab-analytics
type: Opaque
stringData:
  ACCESS_KEY_ID: REPLACE_WITH_ACCESS_KEY_ID
  SECRET_ACCESS_KEY: REPLACE_WITH_SECRET_ACCESS_KEY
